apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'kotlin-kapt'

// 서울 열린데이터광장 인증키는 소스에 두지 않는다.
// local.properties 의 SEOUL_OPENAPI_KEY 또는 같은 이름의 환경변수에서 읽는다.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def seoulOpenApiKey = localProperties.getProperty('SEOUL_OPENAPI_KEY')
        ?: System.getenv('SEOUL_OPENAPI_KEY')
        ?: ''

android {
    namespace 'com.example.gc_last'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.gc_last"
        minSdkVersion 26
        // 동작이 바뀌지 않도록 targetSdk 는 원래 값을 유지한다.
        targetSdkVersion 29
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "SEOUL_OPENAPI_KEY", "\"${seoulOpenApiKey}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.core:core-ktx:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.fragment:fragment-ktx:1.2.4'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'

    implementation 'androidx.navigation:navigation-fragment-ktx:2.2.2'
    implementation 'androidx.navigation:navigation-ui-ktx:2.2.2'

    // Room. suspend DAO 함수를 쓰기 위해 room-ktx 가 필요하다.
    implementation 'androidx.room:room-runtime:2.5.2'
    implementation 'androidx.room:room-ktx:2.5.2'
    kapt 'androidx.room:room-compiler:2.5.2'

    // viewModelScope / LiveData observe 확장 함수
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.5.1'

    implementation 'androidx.paging:paging-runtime:2.1.2'

    // HttpUrl 로 API 주소를 만드는 용도로만 사용한다.
    implementation 'com.squareup.okhttp3:okhttp:4.7.2'
}
